# Example tmux configuration for kvnloo/tmux-agent-fleet
# Copy relevant lines into ~/.tmux.conf (or a file you source from it).
#
# Requires: tmux 3.2+, fzf, Bash 4+
# Optional: jq + agent-deck for the Agent Deck adapter

# --- Binding & popup geometry (set before TPM loads the plugin) ---
set -g @agent-fleet-key 'f'          # prefix + f; use 'none' to skip auto-bind
set -g @agent-fleet-width '96%'
set -g @agent-fleet-height '92%'

# --- Optional: external floating terminal instead of tmux popup ---
# set -g @agent-fleet-launch-command \
#   '$HOME/.local/bin/agent-fleet-popup "#{pane_current_path}" "#{client_tty}"'
# Launcher should run: ~/.tmux/plugins/tmux-agent-fleet/scripts/fleet.sh
# and export: TMUX_AGENT_FLEET_CLIENT=#{client_tty}

# --- TPM install ---
# set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'kvnloo/tmux-agent-fleet'
# run '~/.tmux/plugins/tpm/tpm'

# --- Optional palette (bash; export in shell profile if preferred) ---
# export AGENT_FLEET_PALETTE="$HOME/.cache/wal/colors.sh"
